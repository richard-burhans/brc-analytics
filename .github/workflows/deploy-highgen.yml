name: Deploy HighGen

# Builds the HighGen static export from the committed catalog and publishes it
# to GitHub Pages at highgen.org. The catalog itself is rebuilt separately
# (build-highgen-from-ncbi, build-highgen-external, build-highgen-db) and
# committed, so this build makes no calls to NCBI or UCSC.
on:
  push:
    branches:
      - highgen-site
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one but never cancels a
# deploy that is already publishing.
concurrency:
  group: pages-highgen
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build HighGen production bundle
        run: npm run build-prod:highgen
      - name: Add custom domain
        run: echo "highgen.org" > sites/highgen/out/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/highgen/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
